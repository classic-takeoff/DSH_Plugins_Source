name: Deploy plugin index

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: node --test --test-isolation=none "test/*.test.mjs"

      - name: Resolve Pages URL
        id: pages
        uses: actions/configure-pages@v5

      - name: Build index
        run: node scripts/build.mjs --index-url "${{ steps.pages.outputs.base_url }}/index.json"

      - name: Validate index
        run: node scripts/validate.mjs --index-url "${{ steps.pages.outputs.base_url }}/index.json"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
